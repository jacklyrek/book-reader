name = "pdr-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Deploys to the free subdomain: https://pdr-proxy.<your-subdomain>.workers.dev
# That URL is what goes in the app's VITE_PROXY_BASE.
workers_dev = true

# The app's origin(s). The Worker refuses requests from anywhere else, which is
# what keeps this from being a general open proxy (§6.1). No trailing slashes.
[vars]
ALLOWED_ORIGINS = "https://jacklyrek.github.io,http://localhost:5173"
REQUIRE_SIGNATURE = "true"

# Secrets — set with `wrangler secret put NAME`, never in this file:
#   PROXY_HMAC_KEY   must match the app's VITE_PROXY_HMAC_KEY. Optional: with no
#                    key set, signature checking is skipped entirely and the
#                    origin allowlist is the only gate.
#   SE_OPDS_EMAIL    Patrons Circle email, for the Standard Ebooks bulk feed.

[observability]
enabled = true

# Only if you move to a custom domain later — this needs a zone you actually own
# on Cloudflare, and deploy fails if you don't. workers_dev above is enough.
# [[routes]]
# pattern = "proxy.yourdomain.com/*"
# custom_domain = true
